<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>RecoMe — Signing in...</title>
  <style>
    body {
      background: #060d1a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }
    .logo { font-size: 24px; font-weight: 800; margin-bottom: 16px; }
    .logo span { color: #5eead4; }
    .status { font-size: 14px; color: rgba(255,255,255,0.6); margin-bottom: 24px; }
    .spinner {
      width: 24px; height: 24px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #5eead4;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .success { color: #5eead4; font-weight: 600; }
    .error { color: #f87171; font-size: 13px; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="logo">Reco<span>Me</span></div>
  <div class="spinner" id="spinner"></div>
  <div class="status" id="status">Signing you in...</div>

  <script>
    (async function() {
      const statusEl = document.getElementById('status');
      const spinnerEl = document.getElementById('spinner');

      try {
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        const refresh = params.get('refresh');

        if (!token) {
          throw new Error('No authentication token received');
        }

        // Store tokens securely in extension local storage
        await chrome.storage.local.set({
          recome_cloud_access_token: token,
          recome_cloud_refresh_token: refresh || '',
          recome_auth_timestamp: new Date().toISOString(),
        });

        // Mark onboarding as complete since user has an account
        await chrome.storage.sync.set({
          recome_onboarding_done: true,
          recome_onboarding_version: 1,
        });
        // Also write to local as fallback
        await chrome.storage.local.set({
          recome_onboarding_done: true,
          recome_onboarding_version: 1,
        });

        // Fetch user profile to get email/tier
        try {
          const res = await fetch('https://recome-api.fly.dev/user/profile', {
            headers: { 'Authorization': 'Bearer ' + token },
          });
          if (res.ok) {
            const profile = await res.json();
            await chrome.storage.local.set({
              recome_user_profile: {
                email: profile.email,
                displayName: profile.displayName,
                tier: profile.tier || 'FREE',
                avatarUrl: profile.avatarUrl,
              },
            });
          }
        } catch (e) {
          // Profile fetch is non-critical — continue
          console.warn('Profile fetch failed:', e);
        }

        // Success
        spinnerEl.style.display = 'none';
        statusEl.innerHTML = '<span class="success">Signed in successfully!</span><br><small style="color:rgba(255,255,255,0.4)">You can close this tab.</small>';

        // Auto-close after 2 seconds
        setTimeout(() => window.close(), 2000);

      } catch (err) {
        spinnerEl.style.display = 'none';
        statusEl.innerHTML = '<span class="error">Sign-in failed: ' + (err.message || 'Unknown error') + '</span>';
      }
    })();
  </script>
</body>
</html>
