<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>RecoMe — Signing in...</title>
    <style>
      body {
        background: #060d1a;
        color: #fff;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Inter', system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        text-align: center;
      }
      .logo {
        font-size: 24px;
        font-weight: 800;
        margin-bottom: 16px;
      }
      .logo span {
        color: #5eead4;
      }
      .status {
        font-size: 14px;
        color: rgba(255, 255, 255, 0.6);
        margin-bottom: 24px;
      }
      .spinner {
        width: 24px;
        height: 24px;
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-top-color: #5eead4;
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .success {
        color: #5eead4;
        font-weight: 600;
      }
      .error {
        color: #f87171;
        font-size: 13px;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <div class="logo">Reco<span>Me</span></div>
    <div class="spinner" id="spinner"></div>
    <div class="status" id="status">Signing you in...</div>

    <script src="callback.js"></script>
  </body>
</html>
