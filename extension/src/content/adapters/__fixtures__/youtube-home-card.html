<!-- YouTube home feed card (minimal structure for selector validation) -->
<ytd-browse>
  <ytd-two-column-browse-results-renderer>
    <ytd-rich-item-renderer>
      <div id="content">
        <ytd-rich-grid-media>
          <div id="dismissible">
            <a id="thumbnail" href="/watch?v=dQw4w9WgXcQ">
              <img src="https://example.com/thumb.jpg" />
            </a>
            <div id="details">
              <a id="video-title-link" href="/watch?v=dQw4w9WgXcQ">
                <yt-formatted-string id="video-title">Best Headphones 2026 - Ultimate Guide</yt-formatted-string>
              </a>
              <a class="yt-simple-endpoint" href="/@TechReviewer">
                <yt-formatted-string id="text">TechReviewer</yt-formatted-string>
              </a>
              <span class="inline-metadata-item">1.2M views</span>
              <span class="inline-metadata-item">3 days ago</span>
            </div>
          </div>
        </ytd-rich-grid-media>
      </div>
    </ytd-rich-item-renderer>
  </ytd-two-column-browse-results-renderer>
</ytd-browse>
