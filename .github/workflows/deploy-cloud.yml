name: Deploy Cloud API

on:
  push:
    branches: [main]
    paths:
      - 'cloud/**'
      - '.github/workflows/deploy-cloud.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud

    steps:
      - uses: actions/checkout@v7

      # Fail fast with an actionable message instead of flyctl's cryptic
      # "no access token available" when the secret was never configured.
      # Setup: flyctl tokens create deploy -a recome-api   (locally, logged in)
      #        gh secret set FLY_API_TOKEN                  (paste the token)
      - name: Check deploy credentials
        run: |
          if [ -z "${{ secrets.FLY_API_TOKEN }}" ]; then
            echo "::error title=FLY_API_TOKEN not configured::Repository secret FLY_API_TOKEN is empty — deploys are disabled. Create one with 'flyctl tokens create deploy -a recome-api' and add it via 'gh secret set FLY_API_TOKEN' or Settings → Secrets → Actions."
            exit 1
          fi

      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@1.6

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Post-deploy readiness probe
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 10 https://recome-api.fly.dev/ready || true)
            if [ "$code" = "200" ]; then echo "ready"; exit 0; fi
            echo "attempt $i: /ready returned $code; retrying in 10s"
            sleep 10
          done
          echo "::error title=Deploy not ready::/ready never returned 200 after deploy — check fly logs."
          exit 1
