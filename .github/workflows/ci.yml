name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Three parallel jobs — one per subproject. PRs are blocked when any fails
# (configure in repo Branch Protection → "Require status checks to pass").

jobs:
  # ── Extension (root project) — Phase 0 v2.0.0 ─────────────────────────────
  extension:
    name: extension (typecheck + lint + jest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test (jest, 120 tests)
        run: npm test
      - name: Build
        run: npm run build
      - name: Upload dist/ artifact (main push only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: extension-dist
          path: dist/
          retention-days: 7

  # ── Cloud — Hono + Prisma backend ─────────────────────────────────────────
  # Vitest tests are skipped here for now (many are integration tests that
  # need Postgres + Neo4j + Qdrant service containers). When the integration
  # suite is reorganised, swap `npm run typecheck` for `npm test`.
  cloud:
    name: cloud (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - name: Install
        run: npm ci
      - name: Prisma generate (required for typecheck to see model types)
        run: npx prisma generate
      - name: Typecheck
        run: npx tsc --noEmit

  # ── Web — Next 16 + React 19 + Tailwind 4 ─────────────────────────────────
  # next build also runs the typechecker, so this single step covers both.
  web:
    name: web (next build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Build (includes typecheck)
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.recome.app
