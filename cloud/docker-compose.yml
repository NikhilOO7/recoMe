services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: recome
      POSTGRES_PASSWORD: recome
      POSTGRES_DB: recome
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/recomeneo4jdev
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data
      - neo4jlogs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.10.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:6333/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://recome:recome@db:5432/recome?schema=public
      JWT_SECRET: dev-secret-change-in-production-min-32-chars
      NODE_ENV: development
      PORT: "3001"

      INTELLIGENCE_ENABLED: "true"
      INTELLIGENCE_RUN_MIGRATIONS_ON_BOOT: "true"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: recomeneo4jdev
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: recome_dev
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: text-embedding-3-small
    depends_on:
      db:
        condition: service_started
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate deploy && node dist/index.js"

volumes:
  pgdata:
  neo4jdata:
  neo4jlogs:
  qdrantdata:
